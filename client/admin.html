<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель — Осмотр техники</title>
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

<!-- ЛОГИН -->
<div id="login-screen">
  <div class="login-card">
    <h2>Панель администратора</h2>
    <p>Доступ только для администраторов</p>
    <div class="field">
      <label>Логин</label>
      <input type="text" id="username" autocomplete="username">
    </div>
    <div class="field">
      <label>Пароль</label>
      <input type="password" id="password" autocomplete="current-password"
             onkeydown="if(event.key==='Enter') handleLogin()">
    </div>
    <button class="btn btn-primary" id="login-btn" onclick="handleLogin()" style="width:100%;margin-top:8px;padding:12px">
      Войти
    </button>
  </div>
</div>

<!-- ОСНОВНОЕ ПРИЛОЖЕНИЕ -->
<div id="app-screen">

  <!-- ШАПКА -->
  <div class="topbar">
    <div class="topbar-brand">⚙ Административная панель</div>
    <div class="topbar-user">
      <span id="topbar-name"></span>
      <button class="btn btn-ghost" onclick="handleLogout()">Выйти</button>
    </div>
  </div>

  <!-- ТАБЫ -->
  <div class="tabs">
    <button class="tab-btn" data-tab="machines" onclick="showTab('machines')">🚛 Машины</button>
    <button class="tab-btn" data-tab="drivers"  onclick="showTab('drivers')">👤 Водители</button>
    <button class="tab-btn" data-tab="reports"  onclick="showTab('reports')">📋 История отчётов</button>
  </div>

  <div class="content">

    <!-- ТАБ: МАШИНЫ -->
    <div id="tab-machines" class="tab-panel">
      <div class="section-card">
        <div class="section-header">
          <h3>Список машин</h3>
        </div>
        <table class="data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Название</th>
              <th>Госномер</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody id="machines-tbody">
            <tr><td colspan="4" style="padding:16px;color:#94a3b8">Загрузка...</td></tr>
          </tbody>
        </table>
        <div class="add-form">
          <div class="field">
            <label>Название *</label>
            <input type="text" id="new-mname" placeholder="Экскаватор CAT 320">
          </div>
          <div class="field">
            <label>Госномер</label>
            <input type="text" id="new-mplate" placeholder="AB 1234 CD">
          </div>
          <button class="btn btn-primary" onclick="addMachine()">+ Добавить</button>
        </div>
      </div>
    </div>

    <!-- ТАБ: ВОДИТЕЛИ -->
    <div id="tab-drivers" class="tab-panel">
      <div class="section-card">
        <div class="section-header">
          <h3>Список водителей / операторов</h3>
        </div>
        <table class="data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Имя</th>
              <th>Логин</th>
              <th>Роль</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody id="drivers-tbody">
            <tr><td colspan="5" style="padding:16px;color:#94a3b8">Загрузка...</td></tr>
          </tbody>
        </table>
        <div class="add-form">
          <div class="field">
            <label>Имя *</label>
            <input type="text" id="new-dname" placeholder="Иван Иванов">
          </div>
          <div class="field">
            <label>Логин *</label>
            <input type="text" id="new-dlogin" placeholder="ivan">
          </div>
          <div class="field">
            <label>Пароль *</label>
            <input type="password" id="new-dpass" placeholder="••••••">
          </div>
          <div class="field" style="max-width:140px">
            <label>Роль</label>
            <select id="new-drole">
              <option value="driver">driver</option>
              <option value="admin">admin</option>
            </select>
          </div>
          <button class="btn btn-primary" onclick="addDriver()">+ Добавить</button>
        </div>
      </div>
    </div>

    <!-- ТАБ: ИСТОРИЯ -->
    <div id="tab-reports" class="tab-panel">
      <div class="section-card">
        <div class="section-header">
          <h3>История осмотров</h3>
        </div>
        <div class="filters">
          <label>Машина:</label>
          <select id="filter-machine" onchange="loadReports()">
            <option value="">Все машины</option>
          </select>
        </div>
        <div id="reports-list">
          <p style="padding:20px;color:#94a3b8">Загрузка...</p>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- ЛАЙТБОКС -->
<div id="lightbox" onclick="closeLightbox()">
  <img id="lightbox-img" src="" alt="Фото">
</div>

<script src="/js/admin.js"></script>

</body>
</html>
